<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>zAgent</title>
<style>
:root{--bg:#0b0d0c;--panel:#0e110f;--line:#252a27;--line2:#303833;--fg:#e8e8e8;--dim:#8b958e;--ok:#52d273;--warn:#f2c94c;--bad:#ff6b6b;--you:#d7f7df;--agent:#9ed8ff;--tool:#f4d88b;--llm:#c9a8ff;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:var(--fg);background:var(--bg);font-size:13px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#777;flex:none}.dot.ok{background:var(--ok);box-shadow:0 0 12px #52d27366}.dot.busy{background:var(--warn)}.dot.bad{background:var(--bad)}
.badge{border:1px solid var(--line2);border-radius:99px;padding:2px 8px;color:var(--dim);font-size:12px}.badge b{color:var(--fg);font-weight:600}
.spacer{flex:1}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
#chat{display:grid;grid-template-rows:1fr auto;min-width:0;min-height:0}
#log{overflow:auto;padding:16px;white-space:pre-wrap;line-height:1.45;word-break:break-word}
#log>div{margin:0 0 4px}
.you{color:var(--you)}.agent{color:var(--agent)}.sys{color:#a5ada7}.error{color:#ff9a9a}.tool{color:var(--tool)}.log{color:#6f7a72}.llm{color:var(--llm)}
.agent::before{content:attr(data-gen) '> ';color:#5d7f95}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input,button,select,textarea{font:inherit;color:var(--fg)}
input,select,textarea{width:100%;background:#111512;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
textarea{min-height:260px;resize:vertical;tab-size:4;font-size:12px;line-height:1.4}
button{background:#171c18;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#59665d}button:disabled{opacity:.5;cursor:not-allowed}button.on{border-color:var(--warn);color:var(--warn)}
aside{border-left:1px solid var(--line);padding:12px;overflow:auto}
h3{margin:4px 0 10px;font-size:11px;color:#a9b3ac;text-transform:uppercase;letter-spacing:.08em}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--panel)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px;font-size:12px}.kv span:nth-child(odd){color:var(--dim)}
.row{display:flex;gap:8px}.row>*{flex:1}.stack>*+*{margin-top:8px}
.small{font-size:11px;color:var(--dim);margin:8px 0 0}
label.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}label.chk input{width:auto}
#gens{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.gen{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid transparent}
.gen.active{border-color:var(--ok)}.gen .st{color:var(--dim)}.gen.crashed .st{color:var(--bad)}.gen button{padding:2px 8px;font-size:11px;margin-left:auto}
progress{width:100%;height:6px}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{border-left:0;border-top:1px solid var(--line);max-height:50vh}}
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span><strong>zAgent</strong>
  <span class="badge">gen <b id="genBadge">–</b></span>
  <span class="badge">model <b id="modelBadge">–</b></span>
  <span id="statusText" style="color:var(--dim)">booting</span>
  <span class="spacer"></span>
  <button id="pauseBtn" title="Kill switch: hold timers and refuse LLM calls">Pause</button>
  <button id="rollbackBtn">Rollback</button>
  <button id="resetBtn">Reset</button>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="composer"><input id="msg" autocomplete="off" placeholder="Talk to the agent. /help, /status, /auto on, /goal …" /><button>Send</button></form>
  </section>
  <aside>
    <div class="card"><h3>Kernel</h3><div class="kv">
      <span>Generation</span><span id="kGen">–</span>
      <span>Lineage</span><span id="kLineage">–</span>
      <span>Compiler</span><span id="kCompiler">not loaded</span>
      <span>Builds</span><span id="kBuilds">0</span>
      <span>LLM calls</span><span id="kCalls">0</span>
      <span>Rollbacks</span><span id="kRollbacks">0</span>
    </div><progress id="dl" hidden></progress><div id="dlText" class="small" hidden></div></div>

    <div class="card stack"><h3>Brain</h3>
      <select id="provider"></select>
      <div id="localBox" class="stack">
        <select id="localModel"></select>
        <div class="kv"><span>Engine</span><span id="engState">not loaded</span><span>Speed</span><span id="engSpeed">–</span></div>
        <button id="loadEngine">Load local model</button>
      </div>
      <div id="remoteBox" class="stack">
        <input id="model" placeholder="model" />
        <input id="endpoint" placeholder="https://…/v1/chat/completions" />
        <input id="apiKey" type="password" placeholder="API key" />
        <select id="effort"><option value="low">effort: low</option><option value="medium">effort: medium</option><option value="high">effort: high</option><option value="xhigh">effort: xhigh</option></select>
        <label class="chk"><input id="rememberKey" type="checkbox" /> remember key in this browser</label>
      </div>
      <p class="small" id="brainNote"></p>
    </div>

    <div class="card"><h3>Generations</h3><div id="gens"></div></div>

    <div class="card stack"><h3>Source · active generation</h3>
      <textarea id="source" spellcheck="false"></textarea>
      <div class="row"><button id="compileBtn">Compile + activate</button><button id="revertBtn">Revert edits</button></div>
      <p class="small">Human override. Goes through the same compile → sandbox self-test → hot swap as agent proposals.</p>
    </div>
  </aside>
</main>
<script type="module" src="./src/ui.js"></script>
</body>
</html>
